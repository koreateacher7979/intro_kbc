        <!-- Huge Timeline Section: Awards & Activities -->

            <!-- Scrollable Container -->

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-8 text-center border-t border-slate-800">

        <p class="text-sm mt-2">가치있는 미래교육 연구소</p>

    <!-- Data & Interaction Logic -->
    <script>
        // 1. Google Sheets 연결 설정
        const SHEET_ID = '1EkMsT9Fkb_U7AiaEynwUW56CbOMYpbTUUpfbrpoQhIM';
        
        // 가져올 시트(탭) 이름 목록과 매칭되는 데이터 키값
        const SHEETS = [
            { name: '학력', key: 'education' },
            { name: '경력', key: 'experience' },
            { name: '자격', key: 'certifications' },
            { name: '활동', key: 'activities' }
        ];

        // 2. Render Functions
        function renderList(containerId, data, isCert = false) {
            const container = document.getElementById(containerId);
            container.innerHTML = ''; 
            
            if (data.length === 0) {
                container.innerHTML = '<p class="text-slate-400 text-sm p-4">등록된 데이터가 없습니다.</p>';
                return;
            }

            data.forEach((item) => {
                const el = document.createElement('div');
                if(!isCert) {
                    el.className = 'flex gap-4 items-start';
                    el.innerHTML = `
                        <div class="mt-1 bg-brand-100 text-brand-600 text-xs font-bold px-2 py-1 rounded whitespace-nowrap min-w-[120px] text-center">
                            ${item.period}
                        </div>
                        <div class="text-slate-700 pt-0.5 leading-relaxed">
                            ${item.detail}
                        </div>
                    `;
                } else {
                    el.className = 'flex gap-3 p-3 bg-slate-50 rounded-lg border border-slate-100 items-center transition hover:bg-brand-50 hover:border-brand-100';
                    el.innerHTML = `
                        <i class="fas fa-check-circle text-brand-400 mt-0.5"></i>
                        <div>
                            <p class="text-slate-800 font-medium">${item.detail}</p>
                            <p class="text-xs text-slate-400">${item.date}</p>
                        </div>
                    `;
                }
                container.appendChild(el);
            });
        }

        function renderActivities(activitiesData) {
            const container = document.getElementById('activities-timeline');
            container.innerHTML = ''; 
            
            // 안전한 정렬 로직 (연도가 숫자가 아닌 글자일 경우의 오류 방지)
            const years = Object.keys(activitiesData).sort((a, b) => {
                const numA = parseInt(a);
                const numB = parseInt(b);
                if (!isNaN(numA) && !isNaN(numB)) return numB - numA;
                return b.localeCompare(a);
            }); 

            if (years.length === 0) {
                container.innerHTML = '<p class="text-slate-400 text-sm p-4"><i class="fas fa-info-circle mr-1"></i> [활동] 시트에서 데이터를 찾을 수 없습니다. 시트명과 내용을 확인해주세요.</p>';
                return;
            }

            years.forEach(year => {
                const items = activitiesData[year];
                const yearSection = document.createElement('div');
                yearSection.className = 'mb-8 relative pl-6 border-l-2 border-brand-200 last:border-0 last:pb-0';
                
                let listHtml = items.map(item => `
                    <li class="relative pl-6 py-3 border-b border-slate-100 last:border-0 group hover:bg-slate-50 rounded-r-lg transition-colors">
                        <span class="absolute left-0 top-1/2 -translate-y-1/2 w-2 h-2 bg-brand-300 rounded-full group-hover:bg-brand-500 transition-colors"></span>
                        <span class="text-slate-700">${item}</span>
                    </li>
                `).join('');

                yearSection.innerHTML = `
                    <div class="absolute -left-[17px] top-0 bg-brand-500 text-white text-sm font-bold px-2 py-1 rounded shadow-sm flex items-center justify-center min-w-[32px]">
                        ${year}
                    </div>
                    <ul class="mt-2 space-y-1">
                        ${listHtml}
                    </ul>
                `;
                container.appendChild(yearSection);
            });
        }

        // 3. 다중 구글 시트 데이터 가져오기 및 파싱
        async function loadData() {
            const containers = ['education-list', 'experience-list', 'certification-list', 'activities-timeline'];
            containers.forEach(id => {
                document.getElementById(id).innerHTML = '<div class="text-brand-500 animate-pulse text-sm font-medium"><i class="fas fa-spinner fa-spin mr-2"></i>데이터를 불러오는 중...</div>';
            });

            const resumeData = { education: [], experience: [], certifications: [], activities: {} };

            try {
                // 4개의 시트를 동시에 요청 (캐시 방지를 위해 현재 시간 추가)
                const fetchPromises = SHEETS.map(sheet => {
                    const noCache = new Date().getTime(); // 캐시 방지용 타임스탬프
                    const sheetUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheet.name)}&t=${noCache}`;
                    
                    return fetch(sheetUrl, { cache: "no-store" }) // 브라우저 캐시 무시 강제
                        .then(res => res.text())
                        .then(csvText => {
                            return new Promise((resolve, reject) => {
                                Papa.parse(csvText, {
                                    header: false, // 컬럼 구조 변경에 완벽 대응하기 위해 배열 형태로 가져옴
                                    skipEmptyLines: true,
                                    complete: function(results) {
                                        resolve({ key: sheet.key, data: results.data });
                                    },
                                    error: reject
                                });
                            });
                        });
                });

                const allResults = await Promise.all(fetchPromises);

                // 파싱된 결과를 resumeData 객체에 분류하여 저장
                allResults.forEach(result => {
                    const { key, data } = result;
                    if (!data || data.length === 0) return;
                    
                    let periodCol = -1;
                    let detailCol = -1;
                    let startIndex = 0;

                    // 1. 헤더(제목) 유무 검사 (최대 2번째 줄까지 스캔)
                    for (let i = 0; i < Math.min(2, data.length); i++) {
                        const rowStr = data[i].map(c => String(c).replace(/\s/g, ''));
                        const pIdx = rowStr.findIndex(c => c.includes('기간'));
                        const dIdx = rowStr.findIndex(c => c.includes('내용'));
                        
                        if (pIdx !== -1 || dIdx !== -1) {
                            periodCol = pIdx !== -1 ? pIdx : 0;
                            detailCol = dIdx !== -1 ? dIdx : 1;
                            startIndex = i + 1; // 제목 다음 줄부터 진짜 데이터
                            break;
                        }
                    }

                    // 2. 만약 헤더를 못 찾았다면, 열(Column) 개수를 기반으로 위치 자동 유추
                    if (periodCol === -1 || detailCol === -1) {
                        const cols = data[0].length;
                        if (cols >= 3) { periodCol = 1; detailCol = 2; } // [분류, 기간, 내용] 형태일 경우
                        else if (cols === 2) { periodCol = 0; detailCol = 1; } // [기간, 내용] 형태일 경우
                        else { periodCol = 0; detailCol = 0; }
                    }

                    for (let i = startIndex; i < data.length; i++) {
                        const row = data[i];
                        let period = row[periodCol] ? String(row[periodCol]).trim() : '';
                        let detail = row[detailCol] ? String(row[detailCol]).trim() : '';

                        if (!detail && period) { detail = period; period = ''; }
                        if (!detail) continue; // 완전히 빈 데이터는 건너뜀

                        if (key === 'education') {
                            resumeData.education.push({ period, detail });
                        } else if (key === 'experience') {
                            resumeData.experience.push({ period, detail });
                        } else if (key === 'certifications') {
                            resumeData.certifications.push({ date: period, detail });
                        } else if (key === 'activities') {
                            // 연도가 2025.10 처럼 되어있어도 자동으로 앞의 연도(2025)만 추출하여 묶음
                            const yearMatch = period.match(/^20\d{2}/);
                            const year = yearMatch ? yearMatch[0] : (period || '기타');
                            
                            if (!resumeData.activities[year]) {
                                resumeData.activities[year] = [];
                            }
                            resumeData.activities[year].push(detail);
                        }
                    }
                });

                // 화면에 렌더링
                renderList('education-list', resumeData.education);
                renderList('experience-list', resumeData.experience);
                renderList('certification-list', resumeData.certifications, true);
                renderActivities(resumeData.activities);

            } catch (error) {
                console.error('Error fetching data:', error);
                containers.forEach(id => {
                    document.getElementById(id).innerHTML = '<p class="text-red-500 text-sm"><i class="fas fa-exclamation-circle mr-1"></i>데이터를 불러오는데 실패했습니다. 시트 이름이나 공유 설정을 확인해주세요.</p>';
                });
            }
        }

        // 4. Utils
        function copyEmail(email) {
            const el = document.createElement('textarea');
            el.value = email;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0', '-translate-y-10');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-10');
            }, 2500);
        }

        // 5. Initialize
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
